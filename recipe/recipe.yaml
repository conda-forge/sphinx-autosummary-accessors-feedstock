context:
  name: sphinx-autosummary-accessors
  version: "2026.10.0"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: fec7eebe8f5110e9c2c12a26e9bf098a5b15a26688be2d6151d7c5718daf50c4

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=82
    - setuptools_scm >=8
  run:
    - python >=${{ python_min }}
    - sphinx >=6

tests:
  - python:
      imports:
        - sphinx_autosummary_accessors
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/xarray-contrib/sphinx-autosummary-accessors
  summary: sphinx autosummary extension to properly format pandas or xarray accessors
  license: MIT
  license_file: LICENSE
  documentation: https://sphinx-autosummary-accessors.readthedocs.io/
  repository: https://github.com/xarray-contrib/sphinx-autosummary-accessors

extra:
  recipe-maintainers:
    - conda-forge/sphinx
    - keewis
